<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionario de Educación Musical - 4to de Secundaria</title>
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-dark: #4b38b3;
      --secondary: #00b894;
      --accent: #fd79a8;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #2d3436;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 650px;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .header p {
      color: #636e72;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .progress-bar-container {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 10px;
      height: 12px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .question-box {
      margin-bottom: 25px;
    }

    .question-title {
      font-size: 1.2rem;
      color: var(--text);
      font-weight: 700;
      margin-bottom: 15px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 14px 18px;
      text-align: left;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .option-btn:hover:not([disabled]) {
      background: #eef2ff;
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .option-btn.correct {
      background-color: #d4edda !important;
      border-color: #28a745 !important;
      color: #155724 !important;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #f8d7da !important;
      border-color: #dc3545 !important;
      color: #721c24 !important;
    }

    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: none;
    }

    .feedback.correct {
      background-color: #d1e7dd;
      color: #0f5132;
    }

    .feedback.incorrect {
      background-color: #f8d7da;
      color: #842029;
    }

    .footer-nav {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-next {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
      transition: all 0.2s ease;
      display: none;
    }

    .btn-next:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    /* Pantalla de Resultados */
    .results-screen {
      text-align: center;
      display: none;
    }

    .results-screen h2 {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
      font-size: 2.2rem;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(0, 184, 148, 0.4);
    }

    .score-circle span {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .message {
      font-size: 1.1rem;
      color: #2d3436;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn-restart {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 184, 148, 0.3);
      transition: all 0.2s ease;
    }

    .btn-restart:hover {
      background: #00a884;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <!-- Header -->
    <div class="header">
      <h1>Educación Musical 🎵</h1>
      <p>4.º de Secundaria - Evaluación de Conocimientos</p>
    </div>

    <!-- Barra de progreso -->
    <div class="progress-bar-container" id="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Contenedor del Cuestionario -->
    <div id="quiz-screen">
      <div class="question-box">
        <div class="question-title" id="question-text">Cargando pregunta...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="feedback-text"></div>
      </div>
      <div class="footer-nav">
        <button class="btn-next" id="next-btn" onclick="nextQuestion()">Siguiente ➔</button>
      </div>
    </div>

    <!-- Pantalla Final de Resultados -->
    <div class="results-screen" id="results-screen">
      <h2 id="congrats-title">¡Evaluación Finalizada!</h2>
      <div class="score-circle">
        <div id="score-text">0/0</div>
        <span>Puntaje</span>
      </div>
      <p class="message" id="congrats-message"></p>
      <button class="btn-restart" onclick="restartQuiz()">Intentar de nuevo</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "1. ¿Qué es el sonido según el contenido estudiado?",
        options: [
          "Una onda electromagnética que viaja en el vacío.",
          "Una vibración que se propaga a través de un medio (como el aire) y es percibida por el oído.",
          "Una secuencia de notas de piano únicamente.",
          "Un ruido molesto provocado siempre por la maquinaria humana."
        ],
        correct: 1,
        explanation: "El sonido se define como una vibración que se propaga en un medio como el aire y es captada por nuestro sistema auditivo."
      },
      {
        question: "2. ¿A partir de cuántos decibelios (dB) la OMS advierte que el ruido puede ser dañino para la audición en exposición continua?",
        options: [
          "30 dB",
          "50 dB",
          "70 dB",
          "120 dB"
        ],
        correct: 2,
        explanation: "Según la Organización Mundial de la Salud (OMS), los niveles de ruido superiores a 70 dB pueden ser perjudiciales si la exposición es continua."
      },
      {
        question: "3. La regla recomendada para escuchar música de forma segura con audífonos sin causar daño a largo plazo es:",
        options: [
          "Regla del 80/80 (80% de volumen por máximo 80 minutos)",
          "Regla del 60/60 (60% de volumen máximo por no más de 60 minutos)",
          "Escuchar al 100% de volumen con descansos de 10 minutos",
          "Escuchar sin límite de tiempo a cualquier volumen"
        ],
        correct: 1,
        explanation: "La regla general del 60/60 aconseja mantener los dispositivos a un máximo del 60% de su volumen durante un máximo de 60 minutos."
      },
      {
        question: "4. ¿Cuál es la diferencia principal entre un 'sonido musical' y un 'ruido'?",
        options: [
          "El sonido musical está organizado con ritmo/melodía y ondas suaves; el ruido es desorganizado con ondas irregulares.",
          "El ruido solo proviene de la naturaleza y el sonido musical de las máquinas.",
          "No existe ninguna diferencia; ambos provocan la misma respuesta en el cerebro.",
          "El sonido musical supera siempre los 120 dB."
        ],
        correct: 0,
        explanation: "El sonido musical posee organización, ritmo y melodía (ondas suaves), mientras que el ruido presenta ondas irregulares, no tiene armonía y suele causar estrés."
      },
      {
        question: "5. ¿Qué es un 'Ostinato Rítmico'?",
        options: [
          "Un tipo de instrumento musical exclusivo de la zona oriental de Bolivia.",
          "Un patrón o figura rítmica repetitiva que acompaña a una canción o melodía.",
          "Un silencio muy largo dentro de una composición musical.",
          "El nivel máximo de volumen que soporta el oído humano."
        ],
        correct: 1,
        explanation: "Un ostinato rítmico es una estructura o patrón repetitivo que da estabilidad y acompaña la melodía principal."
      },
      {
        question: "6. En la vida cotidiana, ¿cuál de las siguientes opciones es un ejemplo claro de ostinato rítmico natural o del entorno?",
        options: [
          "Un trueno sorpresa durante la noche.",
          "El ritmo constante del tic-tac de un reloj o el andar de un tren.",
          "El grito fuerte de una persona en la calle.",
          "Un choque imprevisto de dos vehículos."
        ],
        correct: 1,
        explanation: "Patrones continuos e ininterrumpidos como el tic-tac de un reloj o el ritmo de un tren son ejemplos de ostinatos cotidianos."
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedbackText = document.getElementById("feedback-text");
    const nextBtn = document.getElementById("next-btn");
    const progressBar = document.getElementById("progress-bar");
    const quizScreen = document.getElementById("quiz-screen");
    const resultsScreen = document.getElementById("results-screen");

    function loadQuestion() {
      const q = questions[currentQuestionIndex];
      questionText.textContent = q.question;
      optionsContainer.innerHTML = "";
      feedbackText.style.display = "none";
      nextBtn.style.display = "none";

      // Actualizar barra de progreso
      const progressPercent = (currentQuestionIndex / questions.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = option;
        btn.onclick = () => selectOption(index, q.correct, q.explanation);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, correctIndex, explanation) {
      const buttons = optionsContainer.getElementsByClassName("option-btn");
      
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].disabled = true;
        if (i === correctIndex) {
          buttons[i].classList.add("correct");
        } else if (i === selectedIndex) {
          buttons[i].classList.add("incorrect");
        }
      }

      if (selectedIndex === correctIndex) {
        score++;
        feedbackText.className = "feedback correct";
        feedbackText.textContent = "¡Correcto! " + explanation;
      } else {
        feedbackText.className = "feedback incorrect";
        feedbackText.textContent = "Incorrecto. " + explanation;
      }

      feedbackText.style.display = "block";
      nextBtn.style.display = "block";
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      progressBar.style.width = "100%";
      quizScreen.style.display = "none";
      resultsScreen.style.display = "block";

      const scoreText = document.getElementById("score-text");
      const congratsTitle = document.getElementById("congrats-title");
      const congratsMessage = document.getElementById("congrats-message");

      scoreText.textContent = `${score}/${questions.length}`;

      const percentage = (score / questions.length) * 100;

      if (percentage === 100) {
        congratsTitle.textContent = "¡Sobresaliente! 🌟";
        congratsMessage.textContent = "¡Demostraste un dominio total de los temas de Ambiente Musical, Contaminación Acústica y Ostinatos Rítmicos! ¡Excelente trabajo!";
      } else if (percentage >= 70) {
        congratsTitle.textContent = "¡Muy Buen Trabajo! 👏";
        congratsMessage.textContent = "¡Tienes un buen conocimiento de la materia! Sigue así y repasa los pequeños detalles sobre decibelios y ritmo.";
      } else {
        congratsTitle.textContent = "¡Buen Intento! 📚";
        congratsMessage.textContent = "Te recomendamos revisar nuevamente la unidad temática de Educación Musical para consolidar tus aprendizajes.";
      }
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      quizScreen.style.display = "block";
      resultsScreen.style.display = "none";
      loadQuestion();
    }

    // Inicializar el cuestionario al cargar la página
    loadQuestion();
  </script>

</body>
</html>
